<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Slicefolio logo concept directions</title>
  <desc id="desc">Three distinct geometric logo concepts explored for Slicefolio.</desc>
  <rect width="1200" height="420" fill="#F4F1EA"/>
  <text x="60" y="58" fill="#181815" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="650" letter-spacing="-0.7">Slicefolio — concept directions</text>
  <text x="60" y="86" fill="#74726B" font-family="Inter, Arial, sans-serif" font-size="14">One long design → structured presentation slices</text>

  <g transform="translate(60 118)">
    <rect width="330" height="250" rx="22" fill="#FBFAF7" stroke="#DEDBD3"/>
    <g transform="translate(113 34) scale(1.6)">
      <path fill="#181815" fill-rule="evenodd" clip-rule="evenodd" d="M14 6h36a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6Zm-6 17h38v6H8v-6Zm10 18h38v6H18v-6Z"/>
    </g>
    <text x="24" y="187" fill="#181815" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">01 · Continuum Slice</text>
    <text x="24" y="214" fill="#74726B" font-family="Inter, Arial, sans-serif" font-size="13">One canvas, two cuts, alternating continuity.</text>
    <text x="24" y="237" fill="#FF5A36" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">SELECTED · FAVICON 5/5</text>
  </g>

  <g transform="translate(435 118)">
    <rect width="330" height="250" rx="22" fill="#FBFAF7" stroke="#DEDBD3"/>
    <g transform="translate(105 43)">
      <rect x="0" y="0" width="86" height="44" rx="8" fill="none" stroke="#181815" stroke-width="8"/>
      <rect x="22" y="38" width="86" height="44" rx="8" fill="none" stroke="#181815" stroke-width="8"/>
      <rect x="0" y="76" width="86" height="44" rx="8" fill="none" stroke="#181815" stroke-width="8"/>
    </g>
    <text x="24" y="187" fill="#181815" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">02 · Offset Frames</text>
    <text x="24" y="214" fill="#74726B" font-family="Inter, Arial, sans-serif" font-size="13">Presentation cards stagger into a subtle S rhythm.</text>
    <text x="24" y="237" fill="#74726B" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">CLEAR, BUT MORE GENERIC · FAVICON 3/5</text>
  </g>

  <g transform="translate(810 118)">
    <rect width="330" height="250" rx="22" fill="#FBFAF7" stroke="#DEDBD3"/>
    <g transform="translate(111 39)">
      <path d="M8 0h86v31H35v12h59v31H8V43h59V31H8V0Z" fill="#181815"/>
      <rect x="0" y="14" width="16" height="46" fill="#FBFAF7"/>
      <rect x="86" y="45" width="16" height="46" fill="#FBFAF7"/>
    </g>
    <text x="24" y="187" fill="#181815" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">03 · Crop Boundary</text>
    <text x="24" y="214" fill="#74726B" font-family="Inter, Arial, sans-serif" font-size="13">Cropped edges imply continuation beyond each frame.</text>
    <text x="24" y="237" fill="#74726B" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">DISTINCT, LESS LEGIBLE · FAVICON 2/5</text>
  </g>
</svg>
