name: Prepare release lockfile

on:
  push:
    branches: [chore/open-source-release]
    paths: [.github/workflows/prepare-lockfile.yml]

permissions:
  contents: read

jobs:
  lockfile:
    if: github.repository == 'Hakkam/slicefolio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/open-source-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve dependency lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved dependencies
        run: npm audit --audit-level=low
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Lock release dependencies"
          git push origin HEAD:chore/open-source-release
