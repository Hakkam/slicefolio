name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md. Do not attach private files."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Source and output details
      description: File type, size, page count, output mode, and padding. Use synthetic samples only.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error messages
